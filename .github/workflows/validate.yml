name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/site.test.cjs
      - run: python3 scripts/build.py
      - run: python3 scripts/check_site.py
      - name: Check generated pages are committed
        run: git diff --exit-code -- index.html research.html profile.html
